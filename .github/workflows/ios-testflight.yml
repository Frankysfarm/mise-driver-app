name: iOS → TestFlight

# Baut die Mise-Driver-App in der Cloud (Apple-Rechner bei GitHub) und lädt sie
# direkt zu TestFlight hoch. KEIN lokaler Mac / Xcode / macOS-Update nötig.
#
# EINMALIG nötig (3 GitHub-Secrets unter: Repo → Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID      = die 10-stellige Key-ID
#   APP_STORE_CONNECT_ISSUER_ID   = die Issuer-ID (UUID)
#   APP_STORE_CONNECT_KEY_P8_BASE64 = der .p8-Key, base64-kodiert
#         (Mac/Terminal:  base64 -i AuthKey_XXXX.p8 | pbcopy   → einfügen)
#
# Starten:  Repo → Tab "Actions" → "iOS → TestFlight" → "Run workflow".

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      WORKSPACE: ios/App/App.xcworkspace
      SCHEME: App
      TEAM_ID: T82KC2CU9V
      BUNDLE_ID: app.mise.driver
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Neuestes Xcode auswählen (iOS 26 SDK)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$NEWEST" ] && NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Wähle: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS-Dependencies
        run: npm install

      - name: iOS-Projekt erzeugen + Icons + sync
        run: |
          npx cap add ios || echo "ios existiert bereits"
          npm install -D @capacitor/assets || true
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' \
            --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b' || echo "icons skip"
          npx cap sync ios

      - name: Privacy-Purpose-Strings in Info.plist setzen (ITMS-90683)
        run: |
          PLIST="ios/App/App/Info.plist"
          set_key() {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_key NSPhotoLibraryUsageDescription "Mise Driver braucht Zugriff auf deine Fotos, um Liefer-Beweis-Fotos auszuwaehlen und hochzuladen."
          set_key NSPhotoLibraryAddUsageDescription "Mise Driver speichert Liefer-Beweis-Fotos in deiner Mediathek."
          set_key NSCameraUsageDescription "Mise Driver braucht die Kamera fuer QR-Login und Liefer-Beweis-Fotos."
          set_key NSLocationWhenInUseUsageDescription "Mise Driver braucht deinen Standort, um Lieferzentrale und Kunden deine Position zu zeigen."
          set_key NSLocationAlwaysAndWhenInUseUsageDescription "Mise Driver braucht Hintergrund-Standort fuer Live-Tracking waehrend der Lieferung."
          echo "--- gesetzte Usage-Strings ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -i Usage

      - name: Push-Entitlement setzen (aps-environment)
        run: |
          ENT="ios/App/App/App.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > "$ENT"
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          perl -i -pe 's/(PRODUCT_BUNDLE_IDENTIFIER = app\.mise\.driver;)/$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' "$PBX"
          echo "--- Entitlements-Datei ---"
          cat "$ENT"
          echo "--- Verknuepfungen im Projekt ---"
          grep -c "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" "$PBX"

      - name: AppDelegate APNs-Token an Capacitor weiterleiten (Push-Token-Fix)
        run: |
          AD="ios/App/App/AppDelegate.swift"
          if ! grep -q "capacitorDidRegisterForRemoteNotifications" "$AD"; then
            perl -0pi -e 's/\}(\s*)\z/\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n}\n/' "$AD"
          fi
          echo "--- AppDelegate Push-Methoden vorhanden? ---"
          grep -c "capacitorDidRegisterForRemoteNotifications" "$AD"

      - name: Build-Nummer (datums-basiert) + Version setzen
        run: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          BUILD_NO=$(date +%Y%m%d%H%M)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = ${BUILD_NO};/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0.0;/g" "$PBX"
          echo "Build-Nummer: ${BUILD_NO}"

      - name: CocoaPods
        run: cd ios/App && pod install

      - name: App-Store-Connect-API-Key schreiben
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "Key geschrieben: AuthKey_${KEY_ID}.p8 ($(wc -c < ~/private_keys/AuthKey_${KEY_ID}.p8) bytes)"

      - name: Archive (signiert via API-Key — Entitlements werden eingebacken)
        run: |
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            clean archive
          echo "--- Entitlements im Archiv ---"
          codesign -d --entitlements - "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null | grep -i aps-environment || echo "WARN: kein aps-environment im Archiv"

      - name: IPA exportieren
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload zu TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Lade hoch: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Build-Artefakt sichern (falls Upload manuell nötig)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
