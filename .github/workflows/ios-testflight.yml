name: iOS → TestFlight

# Baut die Mise-Driver-App in der Cloud (Apple-Rechner bei GitHub) und lädt sie
# direkt zu TestFlight hoch. KEIN lokaler Mac / Xcode nötig.
#
# Secrets (Repo → Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID        = 10-stellige Key-ID
#   APP_STORE_CONNECT_ISSUER_ID     = Issuer-ID (UUID)
#   APP_STORE_CONNECT_KEY_P8_BASE64 = .p8-Key, base64-kodiert
#   BUILD_CERT_P12_BASE64           = Apple Distribution Zertifikat (.p12, base64)
#   BUILD_CERT_PASSWORD             = Passwort für das .p12
#   BUILD_PROFILE_BASE64            = Provisioning Profile (.mobileprovision, base64)
#
# Starten: Repo → Actions → "iOS → TestFlight" → "Run workflow"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      WORKSPACE: ios/App/App.xcworkspace
      SCHEME: App
      TEAM_ID: T82KC2CU9V
      BUNDLE_ID: app.mise.driver
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Neuestes Xcode auswählen
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Wähle: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS-Dependencies
        run: npm ci

      - name: iOS Offer-Vertrag testen
        run: bash ios-contract-tests/run.sh

      - name: iOS-Projekt erzeugen + sync
        run: |
          npx cap add ios || echo "ios existiert bereits"
          npm install -D @capacitor/assets || true
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' \
            --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b' || echo "icons skip"
          npx cap sync ios

      - name: Privacy-Purpose-Strings in Info.plist setzen (ITMS-90683)
        run: |
          PLIST="ios/App/App/Info.plist"
          set_key() {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_key NSPhotoLibraryUsageDescription "Mise Driver braucht Zugriff auf deine Fotos, um Liefer-Beweis-Fotos auszuwaehlen und hochzuladen."
          set_key NSPhotoLibraryAddUsageDescription "Mise Driver speichert Liefer-Beweis-Fotos in deiner Mediathek."
          set_key NSCameraUsageDescription "Mise Driver braucht die Kamera fuer QR-Login und Liefer-Beweis-Fotos."
          set_key NSLocationWhenInUseUsageDescription "Mise Driver braucht deinen Standort, um Lieferzentrale und Kunden deine Position zu zeigen."
          set_key NSLocationAlwaysAndWhenInUseUsageDescription "Mise Driver braucht Hintergrund-Standort fuer Live-Tracking waehrend der Lieferung."

      - name: Push-Entitlement setzen (aps-environment) + manuelles Signing
        run: |
          ENT="ios/App/App/App.entitlements"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>\n' > "$ENT"
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          perl -i -pe 's/(PRODUCT_BUNDLE_IDENTIFIER = app\.mise\.driver;)/$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' "$PBX"
          perl -i -pe 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Mise Driver AppStore CI";\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = T82KC2CU9V;/g' "$PBX"
          echo "Signing-Settings gesetzt"

      - name: AppDelegate ersetzen (PushKit/VoIP + CallKit)
        run: |
          cp ios-resources/AppDelegate.swift ios/App/App/AppDelegate.swift
          cp ios-resources/OfferContract.swift ios/App/App/OfferContract.swift
          grep -c "PKPushRegistry\|CXProvider\|capacitorDidRegisterForRemoteNotifications" ios/App/App/AppDelegate.swift
          grep -q "struct OfferEnvelope" ios/App/App/OfferContract.swift

      - name: VoIP-Background-Mode in Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string voip" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string remote-notification" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string location" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :MiseLegacyVoipOffersEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MiseLegacyVoipOffersEnabled bool true" "$PLIST"
          python3 scripts/ensure_url_scheme.py "$PLIST"
          echo "UIBackgroundModes OK"

      - name: Alarm-Sound ins App-Bundle
        run: |
          cp ios-resources/alarm.caf ios/App/App/alarm.caf
          gem install xcodeproj --no-document --silent
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            grp = proj.main_group.find_subpath("App", true)
            alarm_ref = grp.files.find { |f| f.path == "alarm.caf" } || grp.new_reference("alarm.caf")
            unless target.resources_build_phase.files_references.include?(alarm_ref)
              ref = alarm_ref
              target.resources_build_phase.add_file_reference(ref)
            end
            offer_ref = grp.files.find { |f| f.path == "OfferContract.swift" } || grp.new_reference("OfferContract.swift")
            unless target.source_build_phase.files_references.include?(offer_ref)
              ref = offer_ref
              target.source_build_phase.add_file_reference(ref)
            end
            abort "alarm.caf missing from Resources" unless target.resources_build_phase.files_references.include?(alarm_ref)
            abort "OfferContract.swift missing from Sources" unless target.source_build_phase.files_references.include?(offer_ref)
            proj.save
            puts "alarm.caf in Resources; OfferContract.swift in Sources"
          '

      - name: Build-Nummer (datums-basiert) + Version setzen
        run: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          BUILD_NO=$(date +%Y%m%d%H%M)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = ${BUILD_NO};/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0.0;/g" "$PBX"
          echo "Build-Nummer: ${BUILD_NO}"

      - name: CocoaPods
        run: cd ios/App && pod install

      - name: App-Store-Connect-API-Key schreiben
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode \
            > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "Key: $(wc -c < ~/private_keys/AuthKey_${KEY_ID}.p8) bytes"

      - name: Distribution-Zertifikat + Profil installieren
        env:
          P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BUILD_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="ci-temp-pw"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo -n "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          echo "--- Signing-Identitaeten ---"
          security find-identity -v -p codesigning "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mise-driver-appstore.mobileprovision
          echo "Profil installiert"

      - name: Archive
        run: |
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            clean archive
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/archive-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/archive-entitlements.plist" \
            | grep -qx "production"
          test -s "$APP/alarm.caf"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" | grep -q "remote-notification"
          /usr/libexec/PlistBuddy -c "Print :MiseLegacyVoipOffersEnabled" "$APP/Info.plist" | grep -qx "true"
          python3 scripts/ensure_url_scheme.py --check "$APP/Info.plist"
          strings "$APP/App" | grep -q "mise-driver-offer"
          echo "Archive-Vertrag OK"

      - name: IPA exportieren
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>app.mise.driver</key><string>Mise Driver AppStore CI</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload zu TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Lade hoch: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Build-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
