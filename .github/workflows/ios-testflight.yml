name: iOS → TestFlight

# Baut die Mise-Driver-App in der Cloud (Apple-Rechner bei GitHub) und lädt sie
# direkt zu TestFlight hoch. KEIN lokaler Mac / Xcode / macOS-Update nötig.
#
# EINMALIG nötig (3 GitHub-Secrets unter: Repo → Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID      = die 10-stellige Key-ID
#   APP_STORE_CONNECT_ISSUER_ID   = die Issuer-ID (UUID)
#   APP_STORE_CONNECT_KEY_P8_BASE64 = der .p8-Key, base64-kodiert
#         (Mac/Terminal:  base64 -i AuthKey_XXXX.p8 | pbcopy   → einfügen)
#
# Starten:  Repo → Tab "Actions" → "iOS → TestFlight" → "Run workflow".

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      WORKSPACE: ios/App/App.xcworkspace
      SCHEME: App
      TEAM_ID: T82KC2CU9V
      BUNDLE_ID: app.mise.driver
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS-Dependencies
        run: npm install

      - name: iOS-Projekt erzeugen + Icons + sync
        run: |
          npx cap add ios || echo "ios existiert bereits"
          npm install -D @capacitor/assets || true
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' \
            --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b' || echo "icons skip"
          npx cap sync ios

      - name: Build-Nummer (datums-basiert) + Version setzen
        run: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          BUILD_NO=$(date +%Y%m%d%H%M)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = ${BUILD_NO};/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0.0;/g" "$PBX"
          echo "Build-Nummer: ${BUILD_NO}"

      - name: CocoaPods
        run: cd ios/App && pod install

      - name: App-Store-Connect-API-Key schreiben
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "Key geschrieben: AuthKey_${KEY_ID}.p8 ($(wc -c < ~/private_keys/AuthKey_${KEY_ID}.p8) bytes)"

      - name: Archive (automatisches Signing via API-Key)
        run: |
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            clean archive

      - name: IPA exportieren
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload zu TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Lade hoch: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Build-Artefakt sichern (falls Upload manuell nötig)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
