name: iOS → TestFlight

# Baut die Mise-Driver-App in der Cloud (Apple-Rechner bei GitHub) und lädt sie
# direkt zu TestFlight hoch. KEIN lokaler Mac / Xcode nötig.
#
# Secrets (Repo → Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID        = 10-stellige Key-ID
#   APP_STORE_CONNECT_ISSUER_ID     = Issuer-ID (UUID)
#   APP_STORE_CONNECT_KEY_P8_BASE64 = .p8-Key, base64-kodiert
#   BUILD_CERT_P12_BASE64           = Apple Distribution Zertifikat (.p12, base64)
#   BUILD_CERT_PASSWORD             = Passwort für das .p12
#   BUILD_PROFILE_BASE64            = Provisioning Profile (.mobileprovision, base64)
# Opt-in frankys: repository variable FRANKYS_APP_STORE_APP_ID and separate
# secret FRANKYS_BUILD_PROFILE_BASE64 are required; no credential fallback.
#
# Starten: Repo → Actions → "iOS → TestFlight" → "Run workflow"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "mise = existing driver app; frankys = offline installation canary"
        type: choice
        default: mise
        options: [mise, frankys]
      backend_target:
        description: "production = existing server; protected_preview = Franky's protected test server"
        type: choice
        default: production
        options: [production, protected_preview]
  push:
    tags:
      - 'ios-release-*'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      WORKSPACE: ios/App/App.xcworkspace
      SCHEME: App
      TEAM_ID: T82KC2CU9V
      DRIVER_APP_VARIANT: ${{ inputs.variant || 'mise' }}
      DRIVER_BACKEND_TARGET: ${{ inputs.backend_target || 'production' }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Variante und Provisioning vor dem Build validieren
        env:
          FRANKYS_APP_STORE_APP_ID: ${{ vars.FRANKYS_APP_STORE_APP_ID }}
          BUILD_PROFILE_BASE64: ${{ secrets.BUILD_PROFILE_BASE64 }}
          FRANKYS_BUILD_PROFILE_BASE64: ${{ secrets.FRANKYS_BUILD_PROFILE_BASE64 }}
        run: |
          python3 scripts/prepare_ios_variant.py preflight \
            --profile-output "$RUNNER_TEMP/driver.mobileprovision" --github-env "$GITHUB_ENV"

      - name: Neuestes Xcode auswählen
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Wähle: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apple-App und Bundle-ID vor dem Build abgleichen
        env:
          KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: node scripts/check_app_store_identity.cjs

      - name: Variantenvertrag und lokale Installationsseite
        run: |
          python3 ios-contract-tests/AppVariantTests.py
          node --test ios-contract-tests/TestFlightBuildGroupTests.cjs
          python3 scripts/prepare_ios_variant.py prepare-web

      - name: JS-Dependencies
        run: npm ci

      - name: iOS Offer-Vertrag testen
        run: |
          bash ios-contract-tests/run.sh
          npm run test:location
          python3 ios-contract-tests/ExportComplianceTests.py

      - name: iOS-Projekt erzeugen + sync
        run: |
          npx cap add ios || echo "ios existiert bereits"
          npm install -D @capacitor/assets || true
          if [ "$DRIVER_APP_VARIANT" = "frankys" ]; then
            npx @capacitor/assets generate --ios --assetPath resources/variants/frankys \
              --iconBackgroundColor '#194B35' --iconBackgroundColorDark '#194B35' \
              --splashBackgroundColor '#F6EDDA' --splashBackgroundColorDark '#F6EDDA'
          else
            npx @capacitor/assets generate --ios \
              --iconBackgroundColor '#09090b' --iconBackgroundColorDark '#09090b' \
              --splashBackgroundColor '#09090b' --splashBackgroundColorDark '#09090b' || echo "icons skip"
          fi
          npx cap sync ios

      - name: Varianten-Identität und manuelles Signing setzen
        run: |
          python3 scripts/prepare_ios_variant.py configure-plist --path ios/App/App/Info.plist
          python3 scripts/prepare_ios_variant.py configure-entitlements --path ios/App/App/App.entitlements
          gem install xcodeproj --no-document --silent
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            abort "App target missing" unless target
            target.build_configurations.each do |config|
              settings = config.build_settings
              abort "Generated bundle identity mismatch" unless settings["PRODUCT_BUNDLE_IDENTIFIER"] == ENV.fetch("BUNDLE_ID")
              settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
              settings["CODE_SIGN_STYLE"] = "Manual"
              settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_NAME")
              settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
            end
            proj.save
          '

      - name: AppDelegate ersetzen (Standard-APNs)
        run: |
          cp ios-resources/AppDelegate.swift ios/App/App/AppDelegate.swift
          cp ios-resources/LocationTracking.swift ios/App/App/LocationTracking.swift
          cp ios-resources/SecureGpsQueue.swift ios/App/App/SecureGpsQueue.swift
          cp ios-resources/OfferContract.swift ios/App/App/OfferContract.swift
          grep -q "capacitorDidRegisterForRemoteNotifications" ios/App/App/AppDelegate.swift
          ! grep -q "PKPushRegistry\|CXProvider\|PushKit\|CallKit" ios/App/App/AppDelegate.swift
          grep -q "struct OfferEnvelope" ios/App/App/OfferContract.swift

      - name: URL-Schema und Exportangaben prüfen
        run: |
          PLIST="ios/App/App/Info.plist"
          python3 scripts/ensure_url_scheme.py --scheme "$DRIVER_URL_SCHEME" --bundle-id "$BUNDLE_ID" "$PLIST"
          python3 scripts/ensure_export_compliance.py "$PLIST"

      - name: Alarm-Sound ins App-Bundle
        run: |
          cp ios-resources/alarm.caf ios/App/App/alarm.caf
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            grp = proj.main_group.find_subpath("App", true)
            alarm_ref = grp.files.find { |f| f.path == "alarm.caf" } || grp.new_reference("alarm.caf")
            unless target.resources_build_phase.files_references.include?(alarm_ref)
              target.resources_build_phase.add_file_reference(alarm_ref)
            end
            source_names = ["LocationTracking.swift", "SecureGpsQueue.swift", "OfferContract.swift"]
            source_names.each do |name|
              source_ref = grp.files.find { |f| f.path == name } || grp.new_reference(name)
              unless target.source_build_phase.files_references.include?(source_ref)
                target.source_build_phase.add_file_reference(source_ref)
              end
            end
            abort "alarm.caf missing from Resources" unless target.resources_build_phase.files_references.include?(alarm_ref)
            source_names.each do |name|
              ref = grp.files.find { |f| f.path == name }
              abort "#{name} missing from Sources" unless ref && target.source_build_phase.files_references.include?(ref)
            end
            proj.save
            puts "alarm.caf in Resources; native Swift sources in Sources"
          '

      - name: Build-Nummer (datums-basiert) + Version setzen
        run: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          test -n "$BUILD_NO"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = ${BUILD_NO};/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0.0;/g" "$PBX"
          echo "BUILD_NO=${BUILD_NO}" >> "$GITHUB_ENV"
          echo "Build-Nummer: ${BUILD_NO}"

      - name: CocoaPods
        run: cd ios/App && pod install

      - name: App-Store-Connect-API-Key schreiben
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode \
            > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "Key: $(wc -c < ~/private_keys/AuthKey_${KEY_ID}.p8) bytes"

      - name: Distribution-Zertifikat + Profil installieren
        env:
          P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="ci-temp-pw"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo -n "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          echo "--- Signing-Identitaeten ---"
          security find-identity -v -p codesigning "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/driver.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "Profil installiert"

      - name: Archive
        run: |
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            clean archive
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/archive-entitlements.plist"
          if [ "$DRIVER_APP_VARIANT" = "mise" ]; then
            /usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/archive-entitlements.plist" | grep -qx "production"
          else
            ! /usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/archive-entitlements.plist"
          fi
          test -s "$APP/alarm.caf"
          if [ "$DRIVER_APP_VARIANT" = "mise" ]; then
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" | grep -q "remote-notification"
          fi
          ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" | grep -q "voip"
          python3 scripts/ensure_url_scheme.py --check --scheme "$DRIVER_URL_SCHEME" --bundle-id "$BUNDLE_ID" "$APP/Info.plist"
          python3 scripts/prepare_ios_variant.py check-plist --path "$APP/Info.plist"
          python3 scripts/prepare_ios_variant.py check-capacitor-config --path "$APP/capacitor.config.json"
          python3 scripts/ensure_export_compliance.py "$APP/Info.plist" --check
          strings "$APP/App" | grep -q "mise-driver-offer"
          echo "Archive-Vertrag OK"

      - name: IPA exportieren
        run: |
          python3 scripts/prepare_ios_variant.py export-options --path "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload zu TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Lade hoch: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Exakten Build für interne Tester freigeben
        env:
          KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          node - <<'EOF'
          const crypto = require('crypto');

          const keyPem = Buffer.from(process.env.KEY_P8_B64, 'base64').toString('utf8');
          const keyId = process.env.KEY_ID;
          const issuerId = process.env.ISSUER_ID;
          const appId = process.env.APP_ID;
          const buildNumber = process.env.BUILD_NO;
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          function jwt() {
            const header = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const payload = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1100,aud:'appstoreconnect-v1'})).toString('base64url');
            const message = `${header}.${payload}`;
            const sign = crypto.createSign('SHA256');
            sign.update(message);
            return `${message}.${sign.sign({key:keyPem,dsaEncoding:'ieee-p1363'}).toString('base64url')}`;
          }

          async function api(path, method='GET', body=null, accepted=[]) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method,
              headers: {Authorization:`Bearer ${jwt()}`,'Content-Type':'application/json'},
              ...(body ? {body:JSON.stringify(body)} : {}),
            });
            const text = await response.text();
            if (!response.ok && !accepted.includes(response.status)) {
              throw new Error(`${method} ${path} -> ${response.status}: ${text.slice(0,500)}`);
            }
            return text ? JSON.parse(text) : {};
          }

          (async () => {
            let build = null;
            for (let attempt=1; attempt<=40; attempt++) {
              const builds = await api(`/v1/builds?filter[app]=${appId}&filter[version]=${encodeURIComponent(buildNumber)}&limit=5`);
              build = builds.data?.find(item => item.attributes?.version === buildNumber) ?? null;
              const state = build?.attributes?.processingState ?? 'NOT_VISIBLE';
              console.log(`App Store processing ${attempt}/40: ${state}`);
              if (state === 'INVALID') throw new Error(`Build ${buildNumber} wurde von Apple als INVALID markiert`);
              if (state === 'VALID') break;
              build = null;
              await sleep(30_000);
            }
            if (!build) throw new Error(`Build ${buildNumber} wurde nicht rechtzeitig verarbeitet`);
            if (build.attributes?.usesNonExemptEncryption !== false) {
              throw new Error(`Build ${buildNumber}: Apple-Verschlüsselungsangaben fehlen oder weichen vom geprüften Archiv ab`);
            }

            const groups = await api(`/v1/betaGroups?filter[app]=${appId}&limit=50`);
            const internal = groups.data?.find(group => group.attributes?.isInternalGroup === true);
            if (!internal) throw new Error('Keine interne TestFlight-Gruppe gefunden');
            if (internal.attributes?.hasAccessToAllBuilds === true) {
              console.log(`Build ${buildNumber}: automatische interne Gruppe ${internal.attributes?.name}`);
            } else {
              await api(`/v1/betaGroups/${internal.id}/relationships/builds`, 'POST', {
                data: [{id:build.id,type:'builds'}],
              }, [409]);
              console.log(`Build ${buildNumber} für interne Gruppe ${internal.attributes?.name} freigegeben`);
            }
            let testingState = 'UNKNOWN';
            let groupAssigned = internal.attributes?.hasAccessToAllBuilds === true;
            for (let attempt=1; attempt<=10; attempt++) {
              const detail = await api(`/v1/builds/${build.id}/buildBetaDetail`);
              testingState = detail.data?.attributes?.internalBuildState ?? 'UNKNOWN';
              if (!groupAssigned) {
                // https://developer.apple.com/documentation/appstoreconnectapi/get-v1-betagroups-_id_-relationships-builds
                const linkagePath = `/v1/betaGroups/${internal.id}/relationships/builds`;
                let pagePath = `${linkagePath}?limit=200`;
                const seenPages = new Set();
                while (pagePath && !groupAssigned) {
                  if (seenPages.has(pagePath) || seenPages.size >= 100) throw new Error('Invalid beta-group pagination');
                  seenPages.add(pagePath);
                  const assigned = await api(pagePath);
                  if (!Array.isArray(assigned.data)) throw new Error('Invalid beta-group build linkage response');
                  groupAssigned = assigned.data.some(item => item.type === 'builds' && item.id === build.id);
                  if (!groupAssigned && assigned.links?.next) {
                    const next = new URL(assigned.links.next, 'https://api.appstoreconnect.apple.com');
                    if (next.origin !== 'https://api.appstoreconnect.apple.com' || next.pathname !== linkagePath) {
                      throw new Error('Unexpected beta-group pagination URL');
                    }
                    pagePath = next.pathname + next.search;
                  } else {
                    pagePath = null;
                  }
                }
              }
              console.log(`Build ${buildNumber}: interner Teststatus ${testingState}, Gruppe zugewiesen: ${groupAssigned}`);
              if (groupAssigned && ['READY_FOR_BETA_TESTING', 'IN_BETA_TESTING'].includes(testingState)) break;
              if (['MISSING_EXPORT_COMPLIANCE', 'IN_EXPORT_COMPLIANCE_REVIEW', 'EXPIRED', 'INVALID', 'FAILED'].includes(testingState)) break;
              await sleep(15_000);
            }
            if (!groupAssigned || !['READY_FOR_BETA_TESTING', 'IN_BETA_TESTING'].includes(testingState)) {
              throw new Error(`Build ${buildNumber} ist noch nicht für interne Tests bereit: ${testingState}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          EOF

      - name: Build-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
