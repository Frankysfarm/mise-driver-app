<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>Mise Driver</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #09090b;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    .center {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      gap: 24px;
      padding: 24px;
    }
    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .accent { color: #fbbf24; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .label {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.6;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="center">
    <div>
      <div class="logo" style="text-align:center">Mise<span class="accent">.</span></div>
      <div class="label" style="text-align:center; margin-top:8px">Driver</div>
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="label">Verbinde…</div>
  </div>
  <script>
    /* Fallback redirect — wenn server.url aus capacitor.config.ts nicht greift, nach 2 s manuell weiterleiten. */
    setTimeout(function () {
      if (location.hostname === 'localhost' || location.protocol === 'file:') {
        location.replace('https://mise-gastro.de/driver');
      }
    }, 2000);
  </script>
</body>
</html>
